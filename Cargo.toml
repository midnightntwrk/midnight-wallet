# Rust workspace root.
#
# This repository is a TypeScript monorepo; the one Rust crate in it produces the WASM artifact that
# `@midnightntwrk/wallet-sdk-state-translation` loads, wrapping the ledger's v8-to-v9 state translation. The workspace
# exists at the root so `cargo` and rust-analyzer discover it from anywhere in the repo rather than only from inside the
# crate directory.
#
# See packages/state-translation/wasm/README.md for what the crate does and how it is built. Do not run `cargo` directly:
# `yarn build:wasm` (or `turbo run build:wasm`) materializes the vendored `[patch]` below first.
[workspace]
members = ["packages/state-translation/wasm"]
resolver = "2"

# Both `[patch]` and custom `[profile]` are only honoured in the workspace *root* manifest, which is why they live here
# rather than beside the crate that needs them.

# Every ledger crate, v8 and v9 alike, resolves from its crates.io release; the one exception is below.
[patch.crates-io]
# TEMPORARY. `midnight-storage`'s metered translation loop calls `std::time::Instant::now()`, which is unimplemented on
# wasm32-unknown-unknown and traps. `packages/state-translation/scripts/build-wasm.sh` materializes this directory by
# fetching the published crate, checking its checksum and applying `patches/midnight-storage-wasm-instant.patch`, so
# cargo has to be driven through that script — a missing directory is a hard error here, which is the point: the
# alternative is silently shipping a wasm that traps. Delete this entry, the patch, and the vendoring block in the script
# once a published release carries the fix.
midnight-storage = { path = "packages/state-translation/wasm/.vendor/midnight-storage" }

# Size over speed: this is a one-shot migration tool loaded into a JS runtime, so the artifact's bytes cost more than its
# cycles. Mirrors midnight-ledger's own `wasm` profile.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
