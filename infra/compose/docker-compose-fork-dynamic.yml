# The hard-fork e2e stack: a chain whose genesis carries the pre-fork (ledger 8) runtime, running
# on the post-fork binary, with the indexer and proof server the smoke lane uses, plus the node
# toolkit on hand to enact the fork through governance.
#
# Driven by `packages/e2e-tests/src/tests/fork-fixture.ts` (vitest project `fork`). Every image tag is
# overridable so the lane can follow node release candidates without an edit here. Ports bind to
# `127.0.0.1::<port>` (ephemeral host port) so a hand-run stack on the fixed ports can coexist.
services:
  # One-shot. The OLD release writes the genesis, so the chain starts on the runtime the fork moves
  # off. Runs as root purely to write into the shared volume, and only re-builds if the spec is absent.
  chainspec:
    image: 'ghcr.io/midnight-ntwrk/midnight-node:${FORK_FROM_NODE_TAG:-1.0.1}'
    container_name: chainspec_$TESTCONTAINERS_UID
    user: '0:0'
    entrypoint: ['/bin/bash', '-c']
    command:
      - 'test -s /chainspec/chainspec.json || /midnight-node build-spec > /chainspec/chainspec.json'
    environment:
      CFG_PRESET: 'dev'
    volumes:
      - chainspec:/chainspec
    cap_drop:
      - ALL
    # `build-spec` writes through the image's own data path before emitting the spec on stdout, and
    # cannot do it as root on an appuser-owned tree without these. The node needs the same three.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

  # One-shot. Lifts the new runtime blob out of the new node image into a volume the toolkit can read,
  # in place of a `docker create` + `docker cp` on the host.
  runtime-blob:
    image: 'ghcr.io/midnight-ntwrk/midnight-node:${NODE_TAG:-2.1.0-beta.1}'
    container_name: runtime-blob_$TESTCONTAINERS_UID
    user: '0:0'
    entrypoint: ['/bin/bash', '-c']
    command:
      # `$$` escapes compose interpolation, so the shell sees `$`. The image ships one
      # `/artifacts-<arch>` directory, named for the architecture of the image that was pulled.
      - >
        set -eu; wasm=midnight_node_runtime.compact.compressed.wasm; case "$$(uname -m)" in x86_64) arch=amd64 ;;
        aarch64|arm64) arch=arm64 ;; *) echo "unsupported architecture $$(uname -m)" >&2; exit 1 ;; esac; test -s
        "/runtime/$$wasm" || cp "/artifacts-$$arch/$$wasm" "/runtime/$$wasm"; chmod 644 "/runtime/$$wasm"; ls -l
        "/runtime/$$wasm"
    volumes:
      - runtime:/runtime
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # New binary, old chain. `restart: "no"` on purpose: if the boundary breaks the node, the test
  # should show that rather than paper over it with a restart.
  node:
    image: 'ghcr.io/midnight-ntwrk/midnight-node:${NODE_TAG:-2.1.0-beta.1}'
    container_name: node_$TESTCONTAINERS_UID
    depends_on:
      chainspec:
        condition: service_completed_successfully
      runtime-blob:
        condition: service_completed_successfully
    restart: 'no'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1::9944'
    volumes:
      - chainspec:/chainspec:ro
      - node-data:/node
    environment:
      CFG_PRESET: 'dev'
      CHAIN: '/chainspec/chainspec.json'
      SHOW_CONFIG: 'false'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >
          curl -fs -H 'Content-Type: application/json' -d
          '{"id":1,"jsonrpc":"2.0","method":"chain_getBlockHash","params":[1]}' http://localhost:9944 | grep -q
          '"result":"0x'
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  indexer:
    image: 'ghcr.io/midnight-ntwrk/indexer-standalone:${INDEXER_TAG:-4.4.0-rc.5}'
    container_name: indexer_$TESTCONTAINERS_UID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1::8088'
    environment:
      RUST_LOG: 'indexer=debug,chain_indexer=debug,indexer_api=debug,wallet_indexer=debug,indexer_common=debug,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__SECRET: '${APP_INFRA_SECRET}'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'e2e-test-dummy'
    # No healthcheck: this image ships no curl, so the probe the smoke compose carries can never pass
    # and only leaves the container permanently `unhealthy`. Nothing here waits on it — the fixture
    # polls `/ready` from the host over the mapped port instead, which is a truer readiness check anyway.
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    image: 'ghcr.io/midnight-ntwrk/proof-server:${PROOF_SERVER_TAG:-9.0.0-rc.7}'
    container_name: proof-server_$TESTCONTAINERS_UID
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1::6300'
    environment:
      RUST_BACKTRACE: 'full'
      EXTRA_ARGS: -v
    # No healthcheck, for the same reason as the indexer: no curl in the image. The fixture waits on
    # the listening port, exactly as the smoke fixture does.

  # Never started by `up` — the fixture drives it with
  # `docker compose … --profile tools run --rm toolkit runtime-upgrade …`, which joins the project
  # network so `ws://node:9944` resolves. No `container_name`: `compose run` names its own container.
  # Only on Docker Hub at the pinned tag; ghcr carries the toolkit but not this version.
  toolkit:
    profiles: ['tools']
    image: 'midnightntwrk/midnight-node-toolkit:${TOOLKIT_TAG:-2.1.0-beta.1}'
    volumes:
      - runtime:/runtime:ro
    environment:
      RUST_BACKTRACE: '1'

volumes:
  chainspec:
  runtime:
  node-data:
