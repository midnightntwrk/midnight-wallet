# Override for the WebSocket deflate-compression *fallback* integration test: it freezes the last
# pre-deflate indexer (4.3.x) so the test always exercises negotiation against a server that does
# not know the graphql-transport-ws+deflate subprotocol, regardless of what the compose default
# moves to. That indexer only reads the ledger-v8 chain it shipped against (it rejects a node
# reporting a later protocol version at startup), so the node it ran with is frozen alongside it:
# the override pins the whole pre-deflate stack, not just the indexer. Delete this file (and the
# fallback test it serves) only when support for pre-deflate indexers is deliberately dropped.
services:
  indexer:
    image: 'ghcr.io/midnight-ntwrk/indexer-standalone:4.3.2'
  node:
    image: 'ghcr.io/midnight-ntwrk/midnight-node:1.0.0'
