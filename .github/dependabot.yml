version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    ignore:
      # changesets/action v2 requires @changesets/cli v3; the repo pins CLI v2, so the
      # release-PR job fails with "Changesets CLI v2 is not supported". Lift this when
      # the CLI moves to v3 (and rename the action inputs: title -> pr-title, version
      # -> version-script, setupGitUser is gone).
      - dependency-name: 'changesets/action'
        update-types: ['version-update:semver-major']
