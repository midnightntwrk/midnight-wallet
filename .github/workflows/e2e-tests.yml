name: E2E tests

env:
  SYNC_CACHE: ${{ github.workspace }}/packages/e2e-tests/.sync_cache

on:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        description: Midnight network to use
        required: true
        default: 'preview'
        options:
          - devnet
          - preview
          - preprod
          - stagenet
      seed:
        type: string
        description: Seed of a funded wallet (leave empty to use secret default)
        required: false
      seed2:
        type: string
        description: Seed of another receiving wallet (leave empty to use secret default)
        required: false
      nt_seed:
        type: string
        description: Seed of a funded wallet with native tokens (leave empty to use secret default)
        required: false
      nt_seed2:
        type: string
        description: Seed of another receiving wallet for native tokens (leave empty to use secret default)
        required: false
      modifier:
        type: string
        description: Suite or a testname to run (refer to Jest docs)
        required: false
      skip_cache:
        type: boolean
        description: Skip downloading sync cache (force fresh wallet sync)
        required: false
        default: false
      branch:
        type: string
        description: Branch to run the tests against
        required: false
        default: 'main'
  workflow_call:
    inputs:
      network:
        type: string
        description: Midnight network to use (devnet/undeployed)
        required: true
        default: 'devnet'
      seed:
        type: string
        description: Seed of a funded wallet
        required: false
      seed2:
        type: string
        description: Seed of another receiving wallet
        required: false
      nt_seed:
        type: string
        description: Seed of a funded wallet with native tokens
        required: false
      nt_seed2:
        type: string
        description: Seed of another receiving wallet for native tokens
        required: false
      modifier:
        type: string
        description: Suite or a testname to run (refer to Jest docs)
        required: false
      skip_cache:
        type: boolean
        description: Skip downloading sync cache (force fresh wallet sync)
        required: false
        default: false
      branch:
        type: string
        description: Branch to run the tests against (defaults to caller's ref)
        required: false
    secrets:
      MIDNIGHTCI_PACKAGES_READ:
        required: true
      APP_INFRA_SECRET:
        required: true
      E2E_TESTS_SEED:
        required: true
      E2E_TESTS_SEED2:
        required: true
      E2E_TESTS_SEED_STABLE:
        required: true
      E2E_TESTS_NT_SEED:
        required: true
      E2E_TESTS_NT_SEED2:
        required: true

permissions: {}

jobs:
  build:
    name: E2E tests
    runs-on: ubuntu-latest-8-core-x64
    timeout-minutes: 240
    # One run per network at a time, queued rather than cancelled: runs on a network share its funded wallets and its
    # sync cache, whichever branch or workflow started them. Only here, not also in the calling healthcheck workflows,
    # since a caller holding the same group would wait on its own job.
    concurrency:
      group: e2e-tests-${{ inputs.network }}
      cancel-in-progress: false
    # checks: write and actions: read are what dorny/test-reporter documents for the junit check-run; actions: read
    # also lets the job's own token find and download the healthcheck sync cache from earlier runs.
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref }}
          persist-credentials: false

      # `cache` is `found`, `none` (there is nothing to restore) or `unknown` (the lookup could not read the API). The
      # upload step below tells the last two apart.
      - name: Determine the latest run ID with a sync cache artifact
        if: inputs.skip_cache != true
        id: find_cache
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_NETWORK: ${{ inputs.network }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          SYNC_CACHE_DIR: ${{ env.SYNC_CACHE }}
        run: |
          mkdir -p "$SYNC_CACHE_DIR"
          status=0
          LATEST_RUN_ID=$(./.github/scripts/find_run_id.sh "$REPO" "Healthcheck - $INPUT_NETWORK" ".sync_cache" "$BRANCH") \
            || status=$?
          case "$status" in
            0)
              echo "LATEST_RUN_ID=$LATEST_RUN_ID" >> "$GITHUB_ENV"
              echo "cache=found" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "No sync cache found — wallets will sync from scratch"
              echo "cache=none" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Could not look up the sync cache, so wallets will sync from scratch and this run's cache is uploaded only if every test passes."
              echo "cache=unknown" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        if: inputs.skip_cache != true && steps.find_cache.outputs.cache == 'found'
        continue-on-error: true
        with:
          run-id: ${{ env.LATEST_RUN_ID }}
          path: ${{ env.SYNC_CACHE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: .sync_cache

      - name: Debug
        run: ls -a -R ./packages/e2e-tests

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable corepack
        run: corepack enable

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version

      - name: Log in to GitHub Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: 'https://ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Build wallet and install dependencies
        run: |
          yarn install
          yarn turbo dist

      # Shorter than the job's limit, so the upload and report steps still have time to run and the run reports as
      # failed rather than cancelled. The output is streamed rather than grouped per task, so a run stopped here still
      # shows the test that was running.
      - name: Run e2e tests
        id: tests
        timeout-minutes: 225
        env:
          NETWORK: ${{ inputs.network }}
          SEED: ${{ inputs.seed || secrets.E2E_TESTS_SEED }}
          SEED2: ${{ inputs.seed2 || secrets.E2E_TESTS_SEED2 }}
          SEED_STABLE: ${{ secrets.E2E_TESTS_SEED_STABLE }}
          NT_SEED: ${{ inputs.nt_seed || secrets.E2E_TESTS_NT_SEED }}
          NT_SEED2: ${{ inputs.nt_seed2 || secrets.E2E_TESTS_NT_SEED2 }}
          SYNC_CACHE: ${{ env.SYNC_CACHE }}
          APP_INFRA_SECRET: ${{ secrets.APP_INFRA_SECRET }}
          TEST_MODIFIER: ${{ inputs.modifier }}
        run: |
          yarn turbo test-remote --log-order=stream -- $TEST_MODIFIER

      # Uploaded even when tests failed or the run was stopped: a test saves its wallets' snapshots only when it passes,
      # and deletes them when it fails on its last attempt, so each run keeps the wallets whose tests passed and a lane
      # that starts from scratch can climb out. A run uploads only when it passed every test, restored the previous
      # cache, or had none to restore. A run that restored the cache and then failed uploads it less the snapshots its
      # failed tests deleted, which is deliberate. A run that skipped the cache or could not read it, and did not pass,
      # uploads nothing, so it cannot replace the cache with the few wallets it saved.
      #
      # Kept for a week: the lanes run twice a day, and every run that restores the cache uploads it again. `overwrite`
      # lets a re-run of a failed job upload under the name its first attempt used. A `.tmp` file is a save that was
      # stopped halfway, and is never restored.
      - name: Upload sync cache
        if:
          always() && (steps.tests.outcome == 'success' || steps.download.outcome == 'success' ||
          steps.find_cache.outputs.cache == 'none')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: .sync_cache
          path: |
            ${{ env.SYNC_CACHE }}
            !${{ env.SYNC_CACHE }}/**/*.tmp
          include-hidden-files: true
          overwrite: true
          retention-days: 7

      - name: Publish wallet TS Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: success() || failure()
        with:
          name: Wallet TS packages Junit Tests Report
          # A missing report fails this step only when the tests passed. A test step stopped at its time limit leaves
          # no report behind, and has already failed the run.
          fail-on-empty: ${{ steps.tests.outcome == 'success' }}
          reporter: java-junit
          path: |
            ./packages/e2e-tests/reports/test-report.xml
