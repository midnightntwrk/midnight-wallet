name: E2E tests

env:
  SYNC_CACHE: ${{ github.workspace }}/packages/e2e-tests/.sync_cache

on:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        description: Midnight network to use
        required: true
        default: 'preview'
        options:
          - devnet
          - qanet
          - preview
          - prepod
          - stagenet
      seed:
        type: string
        description: Seed of a funded wallet (leave empty to use secret default)
        required: false
      seed2:
        type: string
        description: Seed of another receiving wallet (leave empty to use secret default)
        required: false
      nt_seed:
        type: string
        description: Seed of a funded wallet with native tokens (leave empty to use secret default)
        required: false
      nt_seed2:
        type: string
        description: Seed of another receiving wallet for native tokens (leave empty to use secret default)
        required: false
      modifier:
        type: string
        description: Suite or a testname to run (refer to Jest docs)
        required: false
      skip_cache:
        type: boolean
        description: Skip downloading sync cache (force fresh wallet sync)
        required: false
        default: false
      branch:
        type: string
        description: Branch to run the tests against
        required: false
        default: 'main'
  workflow_call:
    inputs:
      network:
        type: string
        description: Midnight network to use (devnet/undeployed)
        required: true
        default: 'devnet'
      seed:
        type: string
        description: Seed of a funded wallet
        required: false
      seed2:
        type: string
        description: Seed of another receiving wallet
        required: false
      nt_seed:
        type: string
        description: Seed of a funded wallet with native tokens
        required: false
      nt_seed2:
        type: string
        description: Seed of another receiving wallet for native tokens
        required: false
      modifier:
        type: string
        description: Suite or a testname to run (refer to Jest docs)
        required: false
      skip_cache:
        type: boolean
        description: Skip downloading sync cache (force fresh wallet sync)
        required: false
        default: false
      branch:
        type: string
        description: Branch to run the tests against (defaults to caller's ref)
        required: false
    secrets:
      MIDNIGHTCI_PACKAGES_READ:
        required: true
      APP_INFRA_SECRET:
        required: true
      E2E_TESTS_SEED:
        required: true
      E2E_TESTS_SEED2:
        required: true
      E2E_TESTS_SEED_STABLE:
        required: true
      E2E_TESTS_NT_SEED:
        required: true
      E2E_TESTS_NT_SEED2:
        required: true

permissions: {}

jobs:
  build:
    name: E2E tests
    runs-on: ubuntu-latest-8-core-x64
    timeout-minutes: 240
    # checks: write and actions: read are what dorny/test-reporter documents for the junit check-run; actions: read
    # also lets the job's own token find and download the healthcheck sync cache from earlier runs.
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref }}
          persist-credentials: false

      - name: Determine the latest run ID with a sync cache artifact
        if: inputs.skip_cache != true
        id: find_cache
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_NETWORK: ${{ inputs.network }}
          SYNC_CACHE_DIR: ${{ env.SYNC_CACHE }}
        run: |
          mkdir -p "$SYNC_CACHE_DIR"
          if LATEST_RUN_ID=$(./.github/scripts/find_run_id.sh "$REPO" "Healthcheck - $INPUT_NETWORK" ".sync_cache"); then
            echo "LATEST_RUN_ID=$LATEST_RUN_ID" >> $GITHUB_ENV
            echo "cache_found=true" >> $GITHUB_OUTPUT
          else
            echo "No sync cache found — wallets will sync from scratch"
            echo "cache_found=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.skip_cache != true && steps.find_cache.outputs.cache_found == 'true'
        continue-on-error: true
        with:
          run-id: ${{ env.LATEST_RUN_ID }}
          path: ${{ env.SYNC_CACHE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: .sync_cache

      - name: Debug
        run: ls -a -R ./packages/e2e-tests

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable corepack
        run: corepack enable

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version

      - name: Log in to GitHub Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: 'https://ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Build wallet and install dependencies
        run: |
          yarn install
          yarn turbo dist

      # Stopped short of the job's own limit, so that a wallet that never finishes syncing fails this step instead of
      # cancelling the job: the sync cache is still uploaded and the run reports as failed rather than cancelled. A wallet
      # that never finishes syncing costs a healthcheck file close to two hours, its 45-minute setup and its teardown run
      # twice because of the retry, so a few such files would otherwise run the job into its limit. The output is
      # streamed rather than grouped per task, so whatever the tests had logged by then, including the test that was
      # still running, is in the log.
      - name: Run e2e tests
        timeout-minutes: 225
        env:
          NETWORK: ${{ inputs.network }}
          SEED: ${{ inputs.seed || secrets.E2E_TESTS_SEED }}
          SEED2: ${{ inputs.seed2 || secrets.E2E_TESTS_SEED2 }}
          SEED_STABLE: ${{ secrets.E2E_TESTS_SEED_STABLE }}
          NT_SEED: ${{ inputs.nt_seed || secrets.E2E_TESTS_NT_SEED }}
          NT_SEED2: ${{ inputs.nt_seed2 || secrets.E2E_TESTS_NT_SEED2 }}
          SYNC_CACHE: ${{ env.SYNC_CACHE }}
          APP_INFRA_SECRET: ${{ secrets.APP_INFRA_SECRET }}
          TEST_MODIFIER: ${{ inputs.modifier }}
        run: |
          yarn turbo test-remote --log-order=stream -- $TEST_MODIFIER

      # Uploaded whether or not the tests passed, and even when the job was cancelled. A snapshot is only ever saved by a
      # test that passed, so the cache of a failed or cancelled run is as good as a green run's. It is what lets a lane
      # that starts every run from scratch climb out: each run keeps the wallets that did finish syncing, and the next run
      # starts those from where they left off. The remote files run one at a time, so a later file that runs into the
      # test step's time limit must not discard the snapshots earlier files saved.
      - name: Upload sync cache
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: .sync_cache
          path: ${{ env.SYNC_CACHE }}
          include-hidden-files: true

      - name: Publish wallet TS Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: success() || failure()
        with:
          name: Wallet TS packages Junit Tests Report
          # A test step stopped at its time limit leaves no report behind, and has already failed the run.
          fail-on-empty: false
          reporter: java-junit
          path: |
            ./packages/e2e-tests/reports/test-report.xml
