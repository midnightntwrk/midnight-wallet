name: Wallet ARC checks

on:
  workflow_call:
    outputs:
      check-result:
        description: Set only after the selected check completes successfully
        value: ${{ jobs.general-checks.outputs.result || jobs.test-unit.outputs.result }}
    inputs:
      check:
        description: General validation or unit tests
        required: true
        type: string
    secrets:
      MIDNIGHTCI_PACKAGES_READ:
        required: false

permissions:
  contents: read

env:
  NETWORK: undeployed
  DEPLOYMENT: local

jobs:
  general-checks:
    name: ARC general validation
    if: >-
      inputs.check == 'general' && vars.WALLET_ARC_ENABLED == 'true' && github.repository ==
      'midnightntwrk/midnight-wallet' && ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'))
    runs-on: arc-wallet-ci
    timeout-minutes: 20
    outputs:
      result: ${{ steps.completed.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable corepack
        run: corepack enable

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-general-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-general-
            turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-build-

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts-${{ github.run_id }}
          path: .

      # The following 4 steps are the equivalent of running `yarn verify:check`/`turbo verify:check`
      # They are separated into individual steps to give better visibility of the errors in the ci.
      # Future changes to verify:check should be reflected in these steps.
      - name: Run typecheck
        run: yarn typecheck

      - name: Run format check
        run: yarn format:check

      - name: Run linter
        run: yarn lint

      - name: Check barrel exports
        run: yarn check-barrel-exports

      - name: Check fork vocabulary
        run: yarn check-fork-vocabulary

      - name: Save turbo cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-general-${{ github.run_attempt }}

      - name: Record successful completion
        id: completed
        run: echo 'result=success' >> "$GITHUB_OUTPUT"

  test-unit:
    name: ARC unit tests
    if: >-
      inputs.check == 'unit' && vars.WALLET_ARC_ENABLED == 'true' && github.repository ==
      'midnightntwrk/midnight-wallet' && ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'))
    runs-on: arc-wallet-ci
    timeout-minutes: 20
    outputs:
      result: ${{ steps.completed.outputs.result }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable corepack
        run: corepack enable

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-general-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-general-

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts-${{ github.run_id }}
          path: .

      # Fast gate: pure unit tests only. No Docker pull, no infra.
      - name: Run unit tests
        run: yarn test:unit

      # annotate_only: this job's own status already reports unit pass/fail, so we
      # only want failure annotations on the diff. A check_name here would spawn a
      # detached check-run (owned by the generic "GitHub Actions" app) that GitHub
      # mis-groups under an unrelated suite ("Check for Changeset") — same root
      # cause as the integration reporter, see #520.
      - name: Publish Unit Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        if: success() || failure()
        with:
          annotate_only: true
          report_paths: |
            **/test-report*.xml

      - name: Record successful completion
        id: completed
        run: echo 'result=success' >> "$GITHUB_OUTPUT"
