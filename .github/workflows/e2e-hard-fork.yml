# Hard-fork e2e — the only lane in which a wallet crosses a real protocol boundary.
#
# Every other live-infra lane (PR smoke in ci.yml, the nightly undeployed run in e2e-tests-local.yml, the integration
# matrix) boots the current node on its own genesis, so the chain is post-fork from block 1 and no wallet ever crosses
# anything. This lane instead builds a genesis from the OLD node's spec (ledger 8), runs it on the NEW binary with an
# indexer and a proof server, syncs a facade wallet pre-fork, enacts the ledger 8 -> 9 upgrade through the node
# toolkit's governance `runtime-upgrade`, and asserts the wallet crosses, settles, keeps its balances and restores from
# its post-fork snapshot. Three bugs found by running this scenario by hand (#699, #701, #702) were invisible to every fork test in
# CI; this is what makes them visible.
#
# Why it is NOT part of the required `Tests` gate in ci.yml:
#   * wall-clock is ~6-10 min of Docker on an 8-core runner, on top of a PR's existing test tiers;
#   * it depends on Docker Hub for one image — the node toolkit is published as `midnightntwrk/midnight-node-toolkit`
#     and ghcr has no `2.1.0-beta.1` tag of it. Anonymous Docker Hub pulls from GitHub runners are rate-limited per
#     runner IP, so a busy hour can fail the pull for reasons that have nothing to do with the change under test. A
#     rate-limit flake must not be able to block a merge. Move this into the gate once the toolkit is mirrored to ghcr
#     and the lane has run green nightly for a couple of weeks.
#
# So: nightly, on demand (with image tags as inputs, to follow node release candidates), and on PRs that touch the
# lane's own files — editing the lane exercises the lane.
name: E2E - hard fork

on:
  schedule:
    # 02:00 UTC, after the midnight nightly (e2e-tests-local.yml) has had the runners to itself.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      fork_from_node_tag:
        type: string
        description: Node image whose spec the chain starts from (the pre-fork runtime, ledger 8)
        required: false
        default: '1.0.1'
      node_tag:
        type: string
        description: Node image the chain actually runs on, and whose runtime is upgraded into (ledger 9)
        required: false
        default: '2.1.0-beta.1'
      toolkit_tag:
        type: string
        description: midnight-node-toolkit image that submits the governance runtime-upgrade (Docker Hub)
        required: false
        default: '2.1.0-beta.1'
      indexer_tag:
        type: string
        description: indexer-standalone image
        required: false
        default: '4.4.0-rc.5'
      proof_server_tag:
        type: string
        description: proof-server image (post-fork, ledger 9)
        required: false
        default: '9.0.0-rc.7'
      proof_server_v8_tag:
        type: string
        description: proof-server image the pre-fork half proves at (ledger 8)
        required: false
        default: '8.1.0'
  pull_request:
    # Exactly the lane's own files. Everything about the lane lives in these six paths, so a PR that does not
    # touch them cannot change what it does.
    paths:
      - 'infra/compose/docker-compose-fork-dynamic.yml'
      - 'packages/e2e-tests/src/tests/fork-fixture.ts'
      - 'packages/e2e-tests/src/tests/hardFork.fork.test.ts'
      - 'packages/e2e-tests/vitest.config.ts'
      - 'packages/e2e-tests/package.json'
      - '.github/workflows/e2e-hard-fork.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  MIDNIGHT_GH_USER: ${{ secrets.GH_USERNAME }}
  # PACKAGES_READ, not PACKAGES_WRITE: this lane only ever reads — `yarn install` of the @midnight-ntwrk scoped packages
  # from the GitHub npm registry, and `docker pull` of the node/indexer/proof-server images from ghcr. It publishes
  # nothing. ci.yml's build and e2e-smoke jobs do the same two things with this token, so it is known to be sufficient;
  # the nightly's PACKAGES_WRITE is more than the job needs.
  MIDNIGHT_GH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
  NETWORK: undeployed
  APP_INFRA_SECRET: ${{ secrets.APP_INFRA_SECRET }}

permissions: {}

jobs:
  hard-fork:
    name: Hard fork
    runs-on: ubuntu-latest-8-core-x64
    # The run is ~6-10 min end to end (spec build + boot ~1 min, indexer ready ~1 min, pre-fork sync ~1 min,
    # governance + finality ~2 min, crossing ~1-2 min). 30 leaves room for a cold image pull without letting a hung
    # Docker stack sit on a runner for the default six hours.
    timeout-minutes: 30
    # checks: write is what dorny/test-reporter needs to publish the junit check-run; contents: read is for checkout.
    permissions:
      contents: read
      checks: write
    env:
      # `inputs` is empty on `schedule` and `pull_request`, so these fall back to the same defaults the compose file
      # declares as `${VAR:-default}` — the two must be kept in step.
      FORK_FROM_NODE_TAG: ${{ inputs.fork_from_node_tag || '1.0.1' }}
      NODE_TAG: ${{ inputs.node_tag || '2.1.0-beta.1' }}
      TOOLKIT_TAG: ${{ inputs.toolkit_tag || '2.1.0-beta.1' }}
      INDEXER_TAG: ${{ inputs.indexer_tag || '4.4.0-rc.5' }}
      PROOF_SERVER_TAG: ${{ inputs.proof_server_tag || '9.0.0-rc.7' }}
      PROOF_SERVER_V8_TAG: ${{ inputs.proof_server_v8_tag || '8.1.0' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: setup-node
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ env.MIDNIGHT_GH_TOKEN }}

      - name: Enable corepack
        run: corepack enable

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version
          docker compose version

      # Covers the node, indexer-standalone and proof-server images. The toolkit image is Docker Hub
      # (`midnightntwrk/midnight-node-toolkit`) and is pulled anonymously — see the header note on rate limits.
      - name: Log in to GitHub Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: 'https://ghcr.io'
          username: ${{ env.MIDNIGHT_GH_USER }}
          password: ${{ env.MIDNIGHT_GH_TOKEN }}

      - name: Configure yarn
        run: |
          yarn config set 'npmScopes.midnight-ntwrk.npmAuthToken' "${{ env.MIDNIGHT_GH_TOKEN }}"

      - name: Install dependencies
        run: yarn install --immutable

      # No turbo cache restore here: this lane runs on its own schedule, not off a ci.yml run, so there is no
      # same-`github.run_id` cache to hit. It builds from source every time.
      - name: Run dist
        run: yarn turbo dist

      # `test-fork` pulls the fork compose images itself before handing over to vitest, so the tag env above reaches
      # both the pull and the fixture's `DockerComposeEnvironment`.
      - name: Run hard-fork e2e
        run: yarn turbo test-fork

      - name: Publish hard-fork e2e test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        with:
          name: Hard-fork Junit Test Report
          reporter: java-junit
          path: |
            ./packages/e2e-tests/reports/test-report.xml

      # The fixture streams the node/indexer/proof-server logs into reports/fork-logs/ as the stack runs, because
      # testcontainers tears the compose project down in afterAll — a workflow step running `docker compose logs` after
      # the test would find nothing left to read. Uploading the whole reports/ directory therefore gets both the junit
      # XML and the container logs a post-mortem actually needs.
      - name: Upload reports and container logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hard-fork-reports-${{ github.run_id }}
          path: packages/e2e-tests/reports
