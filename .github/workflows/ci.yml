name: CI

env:
  NETWORK: undeployed
  DEPLOYMENT: local

on:
  workflow_dispatch:
  pull_request:
    branches: ['**']
  push:
    branches: ['main']

concurrency:
  # The event is part of the group so a manual run on a pull request's branch neither cancels the pull request's run
  # nor is cancelled by it; each still replaces an older run of its own event on the same branch.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Decides whether the test jobs, and the publish jobs behind them, run. Every rule lives in
  # `.github/scripts/ci-test-scope.sh`: only a pull request targeting `main` whose changed files are all on its skip list
  # can skip, because such a change cannot alter a test result; it gets Build and General Checks only. Pushes, manual
  # runs and pull requests targeting any other branch always run everything. The changesets release PRs always run too:
  # they rewrite versions and `yarn.lock`, which are not on the skip list, and the script names their branch as a second
  # safeguard.
  test-scope:
    name: Test Scope
    runs-on: ubuntu-24.04
    outputs:
      run-tests: ${{ steps.scope.outputs.run-tests }}
    steps:
      # A pull request needs full history so both parents of the merge commit, and their merge-base, are present;
      # blob-less because a name-only diff reads trees, not file contents. Any other event runs everything without
      # diffing, so one commit is enough. The condition is inverted because 0 is falsy in an expression: `cond && 0 || 1`
      # would always give 1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          filter: blob:none

      # Pins the skip list from both sides, and the `Tests` gate's pass and fail cases: a must-run file the scope script
      # would skip, or a job result the gate would wave through, fails here. These test the branch's copies, the ones
      # that become the base's once the branch merges.
      - name: Test the CI scripts
        run: |
          .github/scripts/ci-test-scope.test.sh
          .github/scripts/ci-tests-gate.test.sh

      # The copy that decides is the base's (`HEAD^1`, the base side of the merge commit), not the branch's, so an edit to
      # the skip list takes effect only once it is on the base and cannot skip the tests of the PR that makes it. This
      # guards against accidents, not intent: a branch can still edit this workflow, so review of changes to it is what
      # keeps the gate honest. Any other event runs everything whichever copy decides, so it uses the branch's.
      #
      # `rev-parse` reads trees only, so it tells a base without the script from a failed fetch of its contents in this
      # blob-less checkout; `git show` then fails the step on a failed fetch instead of falling back to the branch's copy.
      - name: Decide test scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          SCRIPT=.github/scripts/ci-test-scope.sh
          if [ "$EVENT_NAME" = "pull_request" ] && git rev-parse --verify -q "HEAD^1:$SCRIPT" > /dev/null; then
            git show "HEAD^1:$SCRIPT" > "$RUNNER_TEMP/ci-test-scope.sh"
          else
            # Not a pull request, or a base that predates the script: the branch's copy runs until it lands there.
            cp "$SCRIPT" "$RUNNER_TEMP/ci-test-scope.sh"
          fi
          bash "$RUNNER_TEMP/ci-test-scope.sh"

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable corepack
        run: corepack enable

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version

      - name: Log in to GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: 'https://ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run dist
        run: yarn dist

      - name: Save turbo cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-build-${{ github.run_attempt }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-artifacts-${{ github.run_id }}
          path: |
            packages/*/dist/**
            packages/*/tsconfig.*.tsbuildinfo

  # The only Rust in this repository. `packages/state-translation/wasm` wraps the ledger's v8-to-v9 translation crate.
  # Built here rather than committing the 1.7 MB binary, so it cannot go stale against the crate — and verified here, so
  # a broken artifact fails in one obvious place instead of across the integration matrix.
  build-wasm:
    name: Build WASM Translation
    needs: [test-scope, build]
    if: needs.test-scope.outputs.run-tests == 'true'
    runs-on: ubuntu-24.04
    # A cold build compiles both ledgers with LTO; ~6 min observed, and the cargo cache takes most runs well under it.
    timeout-minutes: 30
    env:
      # Ubuntu's clang can target wasm32 (Apple's cannot). The stack protector pulls in OS code that does not exist on
      # wasm — the same reason midnight-ledger's nix build disables it.
      CC_wasm32_unknown_unknown: clang
      CFLAGS_wasm32_unknown_unknown: -fno-stack-protector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The verification step imports the loader from dist, and the ledger packages to build a state to translate.
      # Extracted into packages/ rather than the repository root: upload-artifact strips the common `packages/` prefix,
      # and nothing in this job runs turbo, so — as in e2e-smoke — there is no `^dist` rebuild to paper over a wrong
      # path. It would surface as ERR_MODULE_NOT_FOUND in the verify step.
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts-${{ github.run_id }}
          path: packages

      # Keyed on Cargo.lock: the dependency set is what decides how much has to be recompiled, and it only moves when
      # the translation crate or the patched storage version does.
      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-wasm-${{ runner.os }}-

      # Prebuilt binaries rather than `cargo install`, which would compile wasm-bindgen-cli from source on every cache
      # miss. The wasm-bindgen version must match the crate pin in Cargo.toml exactly or the CLI rejects the .wasm. The
      # SHA-256s pin the release assets themselves, not just their versions: these binaries produce the WASM the package
      # ships, so a replaced asset must fail the job. Update them with the versions, from the GitHub release.
      - name: Install wasm-bindgen and wasm-opt
        env:
          WASM_BINDGEN_VERSION: '0.2.108'
          WASM_BINDGEN_SHA256: 'd15d7e476feec78d0ec9edc27b8f77279ec7a3e6227756e7036e5cd2066800f4'
          BINARYEN_VERSION: '131'
          BINARYEN_SHA256: 'b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db'
        run: |
          set -euo pipefail
          wasm_bindgen="/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          binaryen="/tmp/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -sSfL -o "$wasm_bindgen" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/$(basename "$wasm_bindgen")"
          curl -sSfL -o "$binaryen" "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/$(basename "$binaryen")"
          printf '%s  %s\n' "$WASM_BINDGEN_SHA256" "$wasm_bindgen" "$BINARYEN_SHA256" "$binaryen" | sha256sum -c -
          tar xzf "$wasm_bindgen" -C /tmp
          tar xzf "$binaryen" -C /tmp
          echo "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          echo "/tmp/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check tool versions
        run: |
          rustc --version
          wasm-bindgen --version
          wasm-opt --version

      - name: Build WASM translation
        run: yarn turbo run build:wasm --filter=@midnightntwrk/wallet-sdk-state-translation

      # Compiling proves very little on its own: an artifact built against an unpatched `midnight-storage` links fine
      # and then traps on the first real state. This translates one, so that failure is named here.
      - name: Verify the artifact translates
        run: yarn workspace @midnightntwrk/wallet-sdk-state-translation verify:wasm

      # The integration matrix restores this rather than rebuilding. `test:integration` in `capabilities` and
      # `state-translation` depends on `state-translation`'s `artifacts` gate, and so on `build:wasm` behind it, so
      # without a cache hit each of those jobs would recompile the crate from scratch.
      - name: Save turbo cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-wasm-${{ github.run_attempt }}

  general-checks:
    name: General Checks
    needs: [build]
    runs-on: >-
      ${{ vars.WALLET_ARC_ENABLED == 'true' && github.repository == 'midnightntwrk/midnight-wallet' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]') || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main')) && 'arc-wallet-ci' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable corepack
        run: corepack enable

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-general-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-general-
            turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-build-

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts-${{ github.run_id }}
          path: .

      # The following 4 steps are the equivalent of running `yarn verify:check`/`turbo verify:check`
      # They are separated into individual steps to give better visibility of the errors in the ci.
      # Future changes to verify:check should be reflected in these steps.
      - name: Run typecheck
        run: yarn typecheck

      - name: Run format check
        run: yarn format:check

      - name: Run linter
        run: yarn lint

      - name: Check barrel exports
        run: yarn check-barrel-exports

      - name: Check fork vocabulary
        run: yarn check-fork-vocabulary

      - name: Save turbo cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-general-${{ github.run_attempt }}

  test-unit:
    name: Unit Tests
    needs: [test-scope, general-checks]
    if: needs.test-scope.outputs.run-tests == 'true'
    runs-on: >-
      ${{ vars.WALLET_ARC_ENABLED == 'true' && github.repository == 'midnightntwrk/midnight-wallet' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]') || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main')) && 'arc-wallet-ci' || 'ubuntu-24.04' }}
    # A unit test that loops synchronously cannot be stopped by vitest's own timeout; without this bound it would hold
    # the runner for GitHub's 6-hour default. Recent runs take 3–8 min.
    timeout-minutes: 20
    # checks: write lets the junit-report action publish the unit test-result check-run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable corepack
        run: corepack enable

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-general-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-general-

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts-${{ github.run_id }}
          path: .

      # Fast gate: pure unit tests only. No Docker pull, no infra.
      - name: Run unit tests
        run: yarn test:unit

      # annotate_only: this job's own status already reports unit pass/fail, so we
      # only want failure annotations on the diff. A check_name here would spawn a
      # detached check-run (owned by the generic "GitHub Actions" app) that GitHub
      # mis-groups under an unrelated suite ("Check for Changeset") — same root
      # cause as the integration reporter, see #520.
      - name: Publish Unit Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        if: success() || failure()
        with:
          annotate_only: true
          report_paths: |
            **/test-report*.xml

  # The per-file integration matrix lives in a reusable workflow and is invoked
  # here as a single job. GitHub nests the matrix jobs under this one caller in
  # the checks UI (many parallel runners, one tidy collapsible check), and this
  # job's status is the aggregate gate — green only if every file passed.
  integration:
    name: Integration Tests
    # Runs in parallel with test-unit and e2e-smoke. build-wasm needs only test-scope and build, so it runs alongside
    # general-checks rather than extending the chain; the fork state-translation file needs its artifact, and without
    # the dependency that file would quietly skip instead of failing.
    needs: [test-scope, general-checks, build-wasm]
    if: needs.test-scope.outputs.run-tests == 'true'
    # Grant here too: a reusable workflow's token is capped by the caller job's
    # permissions, so checks: write must be granted at the call site as well.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/integration.yml
    secrets:
      MIDNIGHTCI_PACKAGES_READ: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
      APP_INFRA_SECRET: ${{ secrets.APP_INFRA_SECRET }}

  e2e-smoke:
    name: Smoke E2E
    # Runs in parallel with test-unit and integration: all three start once general-checks passes and test-scope chose to
    # run the tests (integration also waits for build-wasm, which runs alongside general-checks).
    needs: [test-scope, general-checks]
    if: needs.test-scope.outputs.run-tests == 'true'
    runs-on: ubuntu-latest-8-core-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable corepack
        run: corepack enable

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version

      - name: Log in to GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: 'https://ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-general-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-general-

      # The artifact is rooted at the package names (upload-artifact strips the
      # common `packages/` prefix), so extract into packages/ to restore dist to
      # packages/<pkg>/dist. Unlike test:unit/test:integration, test-undeployed
      # has no `^dist` dependency and never rebuilds, so it relies on this dist.
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts-${{ github.run_id }}
          path: packages

      - name: Pre-pull Docker images
        run: docker compose -f infra/compose/docker-compose-dynamic.yml pull

      - name: Run smoke e2e tests
        env:
          APP_INFRA_SECRET: ${{ secrets.APP_INFRA_SECRET }}
        run: |
          yarn dlx turbo test-undeployed -- -t @smoke

  # Persisted-format gate. The compatibility and drift tests themselves run inside `test-unit` along with every other
  # unit test; this job exists for the check that needs git history rather than a test runner — a published fixture
  # records what a shipped SDK actually wrote, so editing one would let a failing compatibility test be "fixed" by
  # rewriting the evidence. `fetch-depth: 0` is why it is a job of its own: every other job checks out shallow, apart
  # from test-scope, whose pull-request history is blob-less and so holds no file contents to compare.
  serialization-formats:
    name: Serialization Formats
    needs: [test-scope, general-checks]
    if: needs.test-scope.outputs.run-tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No toolchain setup and no install: the check is a plain node script over `git diff`, using only the standard
      # library, so the runner's own node runs it.
      #
      # The base is the branch a pull request targets or, on a push, the tip the push moved away from: against the
      # branch's own tip the diff is empty and the gate blind. The copy of the script that runs is the base's, not the
      # branch's, so a branch cannot loosen the gate it is checked by. A force-push or a branch creation reports an
      # all-zeros `before`, which names no commit, so it falls through to `HEAD~1`.
      - name: Check published fixtures are unmodified
        env:
          BASE:
            ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before !=
            '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD~1' }}
        run: |
          SCRIPT=packages/serialization-tests/check-frozen.mjs
          # A base that predates the script has no copy to run, so the branch's own runs until it lands there.
          git show "$BASE:$SCRIPT" > "$RUNNER_TEMP/check-frozen.mjs" 2>/dev/null || cp "$SCRIPT" "$RUNNER_TEMP/check-frozen.mjs"
          node "$RUNNER_TEMP/check-frozen.mjs" "$BASE"

  # Single aggregate gate over all test stages. Produces the "Tests" status check
  # that branch protection requires (the old combined job was also named "Tests"),
  # and stays stable as integration files come and go. `if: always()` so it reports
  # a definitive pass/fail even when a stage fails.
  #
  # The rules live in `.github/scripts/ci-tests-gate.sh`, with a table test that Test Scope runs: Test Scope, Build and
  # General Checks must pass on every run; the test stages must all pass when Test Scope chose to run them, and must all
  # be skipped when it did not.
  #
  # Every test stage gated on `run-tests` must be listed in `needs` and passed to the gate, or its failure gates nothing.
  # Build WASM Translation is the one gated job not listed: Integration Tests needs it, so its failure surfaces there.
  tests:
    name: Tests
    needs: [test-scope, build, general-checks, test-unit, integration, e2e-smoke, serialization-formats]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # Only the gate script is needed, so a sparse, shallow checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Aggregate test results
        env:
          RUN_TESTS: ${{ needs.test-scope.outputs.run-tests }}
          SCOPE: ${{ needs.test-scope.result }}
          BUILD: ${{ needs.build.result }}
          GENERAL: ${{ needs.general-checks.result }}
          UNIT: ${{ needs.test-unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          E2E: ${{ needs.e2e-smoke.result }}
          SERIALIZATION: ${{ needs.serialization-formats.result }}
        run: .github/scripts/ci-tests-gate.sh

  build-publish:
    name: Build for Publishing
    needs: [test-scope, tests]
    if: needs.test-scope.outputs.run-tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable corepack
        run: corepack enable

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version

      - name: Log in to GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: 'https://ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run dist:publish
        run: yarn dist:publish

      - name: Save turbo cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-build-publish-${{ github.run_attempt }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-publish-artifacts-${{ github.run_id }}
          path: |
            packages/*/dist/**
            packages/*/tsconfig.*.tsbuildinfo

  publish-checks:
    name: Publish Checks
    needs: [build-publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: setup-node
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable corepack
        run: corepack enable

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version

      - name: Log in to GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: 'https://ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-build-publish-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-build-publish-

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-publish-artifacts-${{ github.run_id }}
          path: .
        continue-on-error: true

      - name: Run publint
        run: yarn publint
