name: Check for Changeset

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-changeset:
    # Skip release PRs and bot dependency-update PRs — Renovate/Dependabot
    # never author changesets, so the check would always fail on their PRs.
    if: >-
      ${{ !startsWith(github.head_ref, 'changeset-release/') &&
          !startsWith(github.head_ref, 'renovate/') &&
          !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Enable corepack
        run: corepack enable

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version

      - name: Configure yarn
        env:
          NPM_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
        run: |
          yarn config set 'npmScopes.midnight-ntwrk.npmAuthToken' "$NPM_AUTH_TOKEN"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify that a changeset exists
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          yarn changeset status --since="origin/$BASE_REF" --verbose
