enableScripts: false

nodeLinker: node-modules

# Supply-chain cooldown: refuse dependency versions published less than a week ago.
npmMinimalAgeGate: "1w"

# Gotcha: a scope listed here inherits npmMinimalAgeGate's *setting* default (1d) rather than the
# global value above, and the per-scope value wins - so every scope block must state the gate
# explicitly. 0 exempts first-party packages, so same-day internal releases stay installable.
npmScopes:
  midnight-ntwrk:
    npmAlwaysAuth: true
    npmMinimalAgeGate: 0
    npmRegistryServer: "https://npm.pkg.github.com"
  midnightntwrk:
    npmMinimalAgeGate: 0

yarnPath: .yarn/releases/yarn-4.17.1.cjs
