# Pinned so the WASM artifact is reproducible: a silent compiler bump can change the emitted binary or break the `blst`
# C build, and this produces something we ship rather than only run in CI. `midnight-ledger` tracks fenix `stable`, so
# pinning here is a deliberate divergence — bump it consciously.
#
# `targets` is why neither CI nor a contributor needs `rustup target add`: rustup installs the toolchain and the wasm
# target on the first `cargo` invocation in this workspace.
[toolchain]
channel = "1.97"
targets = ["wasm32-unknown-unknown"]
